[tox]
envlist = python310

[testenv]
# Installs from the committed uv.lock so the gate is reproducible per commit, matching open-kgo's
# convention (mloda-ai/open-kgo#66).
runner = uv-venv-lock-runner
usedevelop = true
extras = dev
allowlist_externals = sh
commands =
    pytest
    ruff format --check --line-length 120 .
    ruff check .
    mypy --strict --ignore-missing-imports .
    bandit -c pyproject.toml -r -q .

[testenv:security]
# CVE scanning environment - builds and scans the local package. Resolves fresh (not the lock
# runner) to catch CVEs newer than uv.lock's pins, matching open-kgo's testenv:security.
runner = uv-venv-runner
usedevelop = true
extras = dev
deps =
    pip-audit
allowlist_externals = sh, mkdir
commands =
    mkdir -p security-reports

    sh -c "pip list"

    sh -c "pip-audit --desc --format=json --output=security-reports/pip-audit.json || pip-audit --desc"

    sh -c "echo '=== CVE Scan Summary ==='"
    sh -c "echo 'Tool: pip-audit (Apache 2.0 licensed)'"
    sh -c "echo 'Report: security-reports/pip-audit.json'"
